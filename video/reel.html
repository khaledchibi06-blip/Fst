<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Fast Gaz Reel Overlay</title>
<!--
  طبقة الكتابة فوق فيديوهات الورشة (خلفية شفافة).
  seek(t) يرسم الإطار عند اللحظة t، و render.js يصوّر الإطارات ويركّبها فوق الفيديو.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: 'Cairo', 'DejaVu Sans', sans-serif; color: #fff; }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* علامة الورشة */
  .mark { position: absolute; top: 210px; left: 50px; display: flex; align-items: center; gap: 12px; background: rgba(7,26,61,.72);
    padding: 10px 22px 10px 12px; border-radius: 999px; }
  .mark img { width: 54px; height: 54px; }
  .mark b { font-size: 34px; font-weight: 900; line-height: 1; }
  .mark small { display: block; font-size: 15px; letter-spacing: 3px; color: #ff9f43; font-weight: 800; }

  /* الترجمة */
  .cap { position: absolute; left: 70px; right: 70px; top: 1240px; display: flex; justify-content: center; }
  .cap span { display: inline-block; background: rgba(7,26,61,.86); border-bottom: 10px solid #ff7a1a; border-radius: 30px; padding: 22px 40px 26px;
    font-size: 64px; font-weight: 900; line-height: 1.35; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .cap em { font-style: normal; color: #ff9f43; }

  /* مشاهد الصور */
  .photo { background: #000; overflow: hidden; }
  .photo .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(40px) brightness(.55); }
  .photo .fg { position: absolute; left: 0; width: 1080px; background-size: cover; background-position: center; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  #p1 .fg { top: 380px; height: 810px; border-radius: 0; }
  #p2 .fg { inset: 0; width: auto; height: auto; }

  /* كيفاش تحجز */
  #howto { background: linear-gradient(160deg, rgba(7,26,61,.93), rgba(12,42,94,.93)); }
  .h-title { position: absolute; top: 140px; left: 60px; right: 60px; text-align: center; font-size: 62px; font-weight: 900; line-height: 1.3; }
  .h-title em { font-style: normal; color: #ff9f43; }
  .step { position: absolute; top: 335px; left: 60px; right: 60px; display: flex; justify-content: center; }
  .step span { display: inline-flex; align-items: center; gap: 18px; background: #fff; color: #0a2550; border-radius: 999px; padding: 12px 34px 12px 14px; font-size: 46px; font-weight: 900; }
  .step i { font-style: normal; width: 66px; height: 66px; border-radius: 50%; background: #ff7a1a; color: #fff; display: grid; place-items: center; font-size: 40px; }
  .phone { position: absolute; top: 455px; left: 265px; width: 550px; height: 1070px; border-radius: 60px; background: #0b1530; border: 15px solid #1d2a4a;
    overflow: hidden; box-shadow: 0 50px 100px rgba(0,0,0,.5); }
  .phone .scr { position: absolute; inset: 0; background-size: 100% auto; background-repeat: no-repeat; background-position: top center; }
  .tap { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: rgba(255,122,26,.35); border: 5px solid #ff7a1a; opacity: 0; }
  .ok-badge { position: absolute; top: 1545px; left: 0; right: 0; text-align: center; font-size: 50px; font-weight: 900; color: #3ee08f; opacity: 0; }

  /* الخاتمة */
  #end { background: radial-gradient(900px 700px at 90% 0%, rgba(34,195,230,.35), transparent 60%),
         radial-gradient(800px 700px at 0% 100%, rgba(255,122,26,.28), transparent 60%), linear-gradient(160deg, #071a3d, #0c2a5e);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 260px; }
  #end > * { opacity: 0; }
  .e-logo { width: 220px; height: 220px; }
  .e-name { font-size: 120px; font-weight: 900; margin-top: 20px; line-height: 1.2; }
  .e-eurl { font-size: 40px; letter-spacing: 12px; color: #ff9f43; font-weight: 900; }
  .e-pill { margin-top: 50px; display: inline-flex; align-items: center; gap: 20px; background: linear-gradient(135deg, #ff7a1a, #ff9f43); border-radius: 999px; padding: 26px 60px;
    font-size: 70px; font-weight: 900; box-shadow: 0 24px 60px rgba(255,122,26,.45); }
  .e-pill svg { width: 62px; height: 62px; }
  .e-link { margin-top: 40px; background: #fff; color: #0a2550; border-radius: 26px; padding: 18px 40px; font-size: 48px; font-weight: 900; }
  .e-info { margin-top: 34px; font-size: 40px; font-weight: 700; color: #c6d3ec; display: grid; gap: 14px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
</defs></svg>

<div class="layer photo" id="p1"><div class="bg" style="background-image:url(assets/install-1.jpg)"></div><div class="fg" style="background-image:url(assets/install-1.jpg)"></div></div>
<div class="layer photo" id="p2"><div class="bg" style="background-image:url(assets/install-2.jpg)"></div><div class="fg" style="background-image:url(assets/install-2.jpg)"></div></div>

<div class="mark" id="mark"><img src="../public/logo.svg" alt=""><div><b>فاست غاز</b><small>EURL FAST GAZ</small></div></div>
<div class="cap" id="cap"><span id="capText"></span></div>

<div class="layer" id="howto">
  <div class="h-title">كيفاش تحجز موعدك<br><em>من الموقع؟</em></div>
  <div class="step"><span><i id="stepNum">1</i><b id="stepText"></b></span></div>
  <div class="phone">
    <div class="scr" id="scrA"></div>
    <div class="scr" id="scrB"></div>
    <div class="tap" id="tap"></div>
  </div>
  <div class="ok-badge" id="okBadge">✓ توصلك رقم الحجز</div>
</div>

<div class="layer" id="end">
  <img class="e-logo" src="../public/logo.svg" alt="">
  <div class="e-name">فاست غاز</div>
  <div class="e-eurl ltr">EURL FAST GAZ</div>
  <div class="e-pill"><svg><use href="#i-phone"/></svg><span class="ltr">0775 87 92 28</span></div>
  <div class="e-link">رابط الحجز في البيو</div>
  <div class="e-info"><div>تيارت — بجانب سكوتيار</div><div class="ltr">TikTok: @eurlfastgaz</div></div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const back = (x) => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  // ظهور/اختفاء ناعم بين s و e
  const win = (t, s, e, f = 0.3) => (t < s || t > e) ? 0 : Math.min(1, (t - s) / f, (e - t) / f);

  const CAPTIONS = [
    [0.2, 2.6, 'حاب تنقّص <em>مصروف البنزين</em>؟'],
    [2.6, 5.0, 'في فاست غاز نركّبولك <em>السيرغاز</em> باحترافية'],
    [5.0, 6.5, 'ورشة مجهّزة في <em>تيارت</em>'],
    [6.5, 9.2, 'معدات <em>جديدة ومضمونة</em>'],
    [9.2, 12.7, 'تركيب بالحقن… خدمة <em>نقية ومنظّمة</em>'],
    [12.7, 16.2, 'رونو 16V — <em>خدمة من عندنا</em>'],
    [16.2, 19.7, '<em>ضمان</em> على التركيب + فحص التسربات'],
    [19.7, 23.2, 'راحنا في تيارت — <em>بجانب سكوتيار</em>'],
  ];

  // خطوات الحجز: [البداية، النهاية، الرقم، النص، الشاشة، نقاط اللمس [وقت، x، y]]
  const STEPS = [
    [23.2, 26.2, 1, 'ادخل للرابط في البيو', 1, []],
    [26.2, 29.2, 2, 'اختار الخدمة', 2, [[27.4, 260, 250]]],
    [29.2, 32.2, 3, 'اختار النهار والساعة', 3, [[30.0, 304, 206], [31.0, 152, 360]]],
    [32.2, 35.2, 4, 'اكتب اسمك وتيليفونك وأكّد', 4, [[32.9, 260, 518]]],
  ];

  let capIdx = -1, stepIdx = -1;

  window.seek = (t) => {
    // الترجمة
    const ci = CAPTIONS.findIndex(([s, e]) => t >= s && t < e);
    if (ci !== capIdx) { capIdx = ci; $('capText').innerHTML = ci >= 0 ? CAPTIONS[ci][2] : ''; }
    if (ci >= 0) {
      const [s, e] = CAPTIONS[ci];
      const k = back((t - s) / 0.35);
      $('cap').style.opacity = Math.min(clamp((t - s) / 0.15), clamp((e - t) / 0.15));
      $('cap').style.transform = `translateY(${(1 - k) * 60}px) scale(${0.9 + 0.1 * k})`;
    } else $('cap').style.opacity = 0;

    $('mark').style.opacity = t < 23.0 ? clamp(t / 0.4) : 0;

    // الصور مع حركة تكبير بطيئة
    $('p1').style.opacity = win(t, 9.2, 12.7, 0.2);
    $('p1').querySelector('.fg').style.transform = `scale(${1 + 0.12 * clamp((t - 9.2) / 3.5)}) translateX(${-30 * clamp((t - 9.2) / 3.5)}px)`;
    $('p2').style.opacity = win(t, 12.7, 16.2, 0.2);
    $('p2').querySelector('.fg').style.transform = `scale(${1.05 + 0.12 * clamp((t - 12.7) / 3.5)})`;

    // كيفاش تحجز
    $('howto').style.opacity = win(t, 23.2, 35.4, 0.35);
    const si = STEPS.findIndex(([s, e]) => t >= s && t < e);
    if (si >= 0) {
      const [s, , num, text, scr, taps] = STEPS[si];
      if (si !== stepIdx) {
        stepIdx = si;
        $('stepNum').textContent = num;
        $('stepText').textContent = text;
        $('scrA').style.backgroundImage = `url(assets/site-${scr}.jpg)`;
        $('scrB').style.backgroundImage = 'url(assets/site-5.jpg)';
      }
      $('scrA').style.opacity = 1;
      $('scrA').style.transform = `translateX(${(1 - easeOut((t - s) / 0.4)) * -560}px)`;
      $('scrB').style.opacity = num === 4 ? clamp((t - 33.8) / 0.3) : 0;
      $('okBadge').style.opacity = num === 4 ? clamp((t - 34.0) / 0.3) : 0;
      $('stepNum').parentElement.style.transform = `scale(${back((t - s) / 0.4)})`;
      // لمسة الإصبع
      let tap = 0, tx = 0, ty = 0, ts = 1;
      for (const [at, x, y] of taps) {
        const d = t - at;
        if (d > -0.4 && d < 0.6) { tap = Math.min(clamp((d + 0.4) / 0.2), clamp((0.6 - d) / 0.2)); tx = x; ty = y; ts = d > 0 && d < 0.25 ? 0.7 : 1; }
      }
      Object.assign($('tap').style, { opacity: tap, left: tx + 'px', top: ty + 'px', transform: `scale(${ts})` });
    }

    // الخاتمة
    const end = $('end');
    end.style.opacity = clamp((t - 35.2) / 0.35);
    [...end.children].forEach((c, i) => {
      const k = back((t - 35.4 - i * 0.18) / 0.45);
      c.style.opacity = clamp((t - 35.4 - i * 0.18) / 0.25);
      c.style.transform = `translateY(${(1 - k) * 60}px)`;
    });
  };
  window.seek(0);
</script>
</body>
</html>
