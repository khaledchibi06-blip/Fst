<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>لوحة الإدارة | فاست غاز</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { min-height: 100vh; }
    .login { max-width: 380px; margin: 12vh auto; text-align: center; }
    .login img { width: 64px; margin-bottom: 8px; }
    .login form { display: grid; gap: 12px; margin-top: 18px; }
    .admin-bar { background: var(--blue-dark); color: #fff; }
    .admin-bar .container { display: flex; justify-content: space-between; align-items: center; height: 62px; }
    .admin-bar .logo { color: #fff; }
    .admin-bar .logo small { color: #9fb6d9; }
    main { padding: 24px 0 60px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat { padding: 18px; }
    .stat small { color: var(--muted); font-weight: 600; }
    .stat b { display: block; font-size: 1.9rem; color: var(--blue-dark); line-height: 1.3; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; }
    .filters .field { flex: 1 1 150px; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .quick button.active { background: var(--blue); color: #fff; }
    .table-wrap { overflow-x: auto; background: #fff; border-radius: var(--radius); border: 1px solid var(--line); box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: .93rem; }
    th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #f7f9fc; color: var(--muted); font-weight: 700; font-size: .85rem; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td .sub { display: block; color: var(--muted); font-size: .82rem; }
    td.actions { white-space: nowrap; }
    td.actions select { width: auto; padding: 6px 10px; font-size: .85rem; }
    .icon-btn { background: none; border: 0; cursor: pointer; font-size: 1.1rem; padding: 4px 6px; }
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .day-row td { background: #eef4fd; font-weight: 800; color: var(--blue-dark); }
    dialog { border: 0; border-radius: var(--radius); padding: 24px; width: min(640px, 100% - 32px); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    dialog::backdrop { background: rgba(8,47,102,.45); }
    dialog h3 { margin: 0 0 16px; color: var(--blue-dark); }
    dialog .row { display: flex; gap: 10px; justify-content: flex-start; margin-top: 18px; flex-wrap: wrap; }
    .check-line { display: flex; gap: 8px; align-items: center; font-size: .9rem; margin-top: 12px; }
    .check-line input { width: auto; }
    .closed-list { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; max-height: 260px; overflow-y: auto; }
    .closed-list li { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f7f9fc; border-radius: 10px; }
    .closed-list small { color: var(--muted); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    @media (max-width: 720px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    @media print {
      .admin-bar, .filters, .quick, .stats, td.actions, th:last-child { display: none !important; }
      .table-wrap { box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>

<div class="card login hidden" id="loginBox">
  <img src="logo.svg" alt="">
  <h2 style="margin:0;color:var(--blue-dark)">لوحة إدارة فاست غاز</h2>
  <form id="loginForm">
    <input type="password" name="password" placeholder="كلمة المرور" required autofocus>
    <button class="btn btn-blue" type="submit">دخول</button>
    <div class="alert err hidden" id="loginErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <div class="admin-bar">
    <div class="container">
      <div class="logo"><img src="logo.svg" alt="" width="34"><div>فاست غاز<small>لوحة المواعيد</small></div></div>
      <div style="display:flex;gap:8px">
        <a href="/" class="btn btn-ghost btn-sm" target="_blank">الموقع</a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">خروج</button>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="stats">
      <div class="card stat"><small>مواعيد اليوم</small><b id="stToday">0</b></div>
      <div class="card stat"><small>في انتظار التأكيد</small><b id="stPending">0</b></div>
      <div class="card stat"><small>مؤكدة قادمة</small><b id="stUpcoming">0</b></div>
      <div class="card stat"><small>تركيبات منجزة</small><b id="stDone">0</b></div>
    </div>

    <div class="quick" id="quick">
      <button class="btn btn-outline btn-sm" data-range="today">اليوم</button>
      <button class="btn btn-outline btn-sm" data-range="tomorrow">غداً</button>
      <button class="btn btn-outline btn-sm" data-range="week">7 أيام القادمة</button>
      <button class="btn btn-outline btn-sm" data-range="upcoming">كل القادمة</button>
      <button class="btn btn-outline btn-sm" data-range="all">الكل</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">🖨 طباعة</button>
    </div>

    <div class="toolbar">
      <button class="btn btn-primary btn-sm" id="addBtn">➕ إضافة حجز (زبون اتصل بالهاتف)</button>
      <button class="btn btn-blue btn-sm" id="closedBtn">🚫 أيام العطل / إغلاق يوم</button>
    </div>

    <form class="filters" id="filters">
      <div class="field"><label>من</label><input type="date" name="from"></div>
      <div class="field"><label>إلى</label><input type="date" name="to"></div>
      <div class="field">
        <label>الحالة</label>
        <select name="status">
          <option value="">الكل</option>
          <option value="pending">في انتظار التأكيد</option>
          <option value="confirmed">مؤكد</option>
          <option value="done">منجز</option>
          <option value="cancelled">ملغى</option>
        </select>
      </div>
      <div class="field" style="flex:2 1 200px"><label>بحث</label><input name="q" placeholder="الاسم، الهاتف، رقم الحجز، السيارة"></div>
      <button class="btn btn-blue" type="submit">تصفية</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>الوقت</th><th>رقم الحجز</th><th>الزبون</th><th>السيارة</th><th>الخدمة</th><th>ملاحظات</th><th>الحالة</th><th>إجراءات</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<dialog id="addDialog">
  <h3>إضافة حجز يدوي</h3>
  <form id="addForm" method="dialog">
    <div class="fields">
      <div class="field"><label>الاسم <em>*</em></label><input name="name" required></div>
      <div class="field"><label>الهاتف <em>*</em></label><input name="phone" type="tel" dir="ltr" style="text-align:right" required></div>
      <div class="field"><label>نوع السيارة <em>*</em></label><input name="car_brand" required></div>
      <div class="field"><label>الطراز <em>*</em></label><input name="car_model" required></div>
      <div class="field"><label>سنة الصنع</label><input name="car_year" type="number" min="1970" max="2030"></div>
      <div class="field">
        <label>نظام المحرك</label>
        <select name="fuel_system"><option value="">غير معروف</option><option value="injection">حقن</option><option value="carburetor">كاربيراتور</option></select>
      </div>
      <div class="field full"><label>الخدمة <em>*</em></label><select name="service" id="addService" required></select></div>
      <div class="field"><label>التاريخ <em>*</em></label><input name="date" type="date" required></div>
      <div class="field"><label>الوقت <em>*</em></label><select name="time" id="addTime" required></select></div>
      <div class="field full"><label>ملاحظات</label><textarea name="notes"></textarea></div>
    </div>
    <label class="check-line"><input type="checkbox" name="force"> تجاوز عدد الأماكن (إضافة سيارة حتى لو الموعد ممتلئ)</label>
    <div class="alert err hidden" id="addErr"></div>
    <div class="row">
      <button class="btn btn-primary" type="submit" value="save">حفظ الحجز</button>
      <button class="btn btn-outline" type="button" data-close>إلغاء</button>
    </div>
  </form>
</dialog>

<dialog id="closedDialog">
  <h3>أيام العطل</h3>
  <p class="hint" style="margin-top:0">الأيام المغلقة لا تظهر للزبائن في الحجز.</p>
  <form id="closedForm" class="fields">
    <div class="field"><label>التاريخ</label><input name="date" type="date" required></div>
    <div class="field"><label>السبب (اختياري)</label><input name="reason" placeholder="عيد، عطلة..."></div>
    <div class="field full"><button class="btn btn-blue" type="submit">إغلاق هذا اليوم</button></div>
  </form>
  <div class="alert ok hidden" id="closedMsg"></div>
  <ul class="closed-list" id="closedList"></ul>
  <div class="row"><button class="btn btn-outline" type="button" data-close>إغلاق</button></div>
</dialog>

<script src="admin.js"></script>
</body>
</html>
